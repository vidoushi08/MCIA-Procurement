<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCIA Staff Login</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="login">
    <section class="login-hero">
      <div class="login-hero-text">
        <h1>Growing a<br>Sustainable Future</h1>
        <p>Supporting Mauritius’ sugarcane industry with innovation, people and progress.</p>
      </div>
      <img src="assets/img/login-hero.jpg" alt="">
    </section>

    <section class="login-panel">
      <img src="assets/img/mcia-logo.png" alt="Mauritius Cane Industry Authority">
      <div class="login-form">
        <h2>Sign In</h2>
        <p class="login-sub">Please sign in with your email address and password to continue.</p>

        <div class="notice" id="notice"></div>

        <form id="loginForm" novalidate>
          <div class="login-field">
            <span data-icon="user"></span>
            <input id="email" type="email" placeholder="Email Address" autocomplete="username" required>
          </div>

          <div class="login-field">
            <span data-icon="lock"></span>
            <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
            <button class="eye" type="button" data-eye="password" aria-label="Show password"><span data-icon="eye"></span></button>
          </div>

          <div class="login-row">
            <label><input type="checkbox" id="remember" checked> Remember email</label>
            <a href="#" id="forgot">Forgot Password?</a>
          </div>

          <button class="login-btn" type="submit">Sign In <span data-icon="arrow-right"></span></button>
        </form>
      </div>
    </section>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="staff/staff.js"></script>
  <script>
    const REMEMBER_KEY = "mcia.rememberedEmail";
    const DASHBOARD_BY_ROLE = {
      STAFF: "staff/dashboard.html",
      DEPT_HEAD: "dept-head/dashboard.html",
      ADMIN: "admin/dashboard.html",
    };
    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const rememberBox = document.getElementById("remember");
    const notice = document.getElementById("notice");

    emailInput.value = localStorage.getItem(REMEMBER_KEY) || "";
    session.clear();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        showNotice(notice, "error", "Please enter your email address and password.");
        return;
      }

      try {
        const result = await api.post("/auth/login", { email, password });
        if (rememberBox.checked) {
          localStorage.setItem(REMEMBER_KEY, email);
        } else {
          localStorage.removeItem(REMEMBER_KEY);
        }
        session.set(result.token, result.user);
        location.href = DASHBOARD_BY_ROLE[result.user.role] || "staff/dashboard.html";
      } catch (error) {
        showNotice(notice, "error", error.message);
      }
    });

    document.getElementById("forgot").addEventListener("click", (event) => {
      event.preventDefault();
      showNotice(notice, "info", "Password reset is not available yet. Please contact your administrator.");
    });
  </script>
</body>
</html>
